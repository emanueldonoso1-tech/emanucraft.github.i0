<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Las ideas de Emanu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:white;
    overflow-x:hidden;
}

/* Fondo del cielo */
.cielo{
    height:450px;
    background:linear-gradient(
        to bottom,
        #001b55,
        #008cff,
        white
    );
    position:relative;
    overflow:hidden;
}

/* Estrellas */
.estrella{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    animation:brillar 3s infinite;
}

@keyframes brillar{
    0%,100%{
        opacity:0.2;
        transform:scale(1);
    }
    50%{
        opacity:1;
        transform:scale(2);
    }
}


/* Titulo */
.titulo{
    text-align:center;
    padding-top:80px;
    color:white;
    font-size:55px;
    text-shadow:0 0 15px black;
}


/* Secciones */
.seccion{
    text-align:center;
    margin:50px auto;
}


h2{
    font-size:32px;
    margin-bottom:25px;
}


/* Carrusel */
.carrusel{
    width:650px;
    height:350px;
    margin:auto;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}


.poster{
    width:550px;
    height:300px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 0 50px white;
    transition:0.5s;
}


.flecha{
    position:absolute;
    font-size:60px;
    cursor:pointer;
    color:white;
    text-shadow:0 0 10px black;
    z-index:5;
}

.izquierda{
    left:10px;
}

.derecha{
    right:10px;
}


/* Posters verticales */

.vertical{
    width:250px;
    height:350px;
}


/* Chat */

.chat{
    margin-top:80px;
    padding:40px;
    background:#f4f4f4;
}


.chat h2{
    font-size:35px;
}


textarea{
    width:70%;
    height:150px;
    border-radius:15px;
    padding:15px;
    font-size:18px;
}


/* Final */

.final{
    text-align:center;
    padding:40px;
    font-size:22px;
}


</style>

</head>


<body>


<div class="cielo">

<h1 class="titulo">
Las ideas de Emanu
</h1>


</div>



<section class="seccion">

<h2>Mis ideas</h2>


<div class="carrusel">

<div class="flecha izquierda" onclick="cambiarHorizontal(-1)">❮</div>

<img id="horizontal" class="poster"
src="poster1.jpg">


<div class="flecha derecha" onclick="cambiarHorizontal(1)">❯</div>


</div>

</section>




<section class="seccion">

<h2>Mis historias</h2>


<div class="carrusel">


<div class="flecha izquierda" onclick="cambiarVertical(-1)">❮</div>


<img id="vertical" class="poster vertical"
src="vertical1.jpg">


<div class="flecha derecha" onclick="cambiarVertical(1)">❯</div>


</div>


</section>





<section class="chat">


<h2>
Chatea tus ideas
</h2>


<textarea placeholder="Escribe tu idea aquí..."></textarea>


</section>



<div class="final">

Gracias por ver mi web.

</div>





<script>


// ESTRELLAS

for(let i=0;i<80;i++){

let estrella=document.createElement("div");

estrella.className="estrella";

estrella.style.left=Math.random()*100+"%";

estrella.style.top=Math.random()*450+"px";

estrella.style.animationDelay=Math.random()*3+"s";

document.querySelector(".cielo").appendChild(estrella);

}



// POSTERS HORIZONTALES

let horizontales=[
"poster1.jpg",
"poster2.jpg",
"poster3.jpg"
];


let h=0;


function cambiarHorizontal(valor){

h+=valor;

if(h<0)
h=horizontales.length-1;

if(h>=horizontales.length)
h=0;


document.getElementById("horizontal").src=horizontales[h];

}



setInterval(()=>{

cambiarHorizontal(1);

},10000);





// POSTERS VERTICALES


let verticales=[

"vertical1.jpg",
"vertical2.jpg",
"vertical3.jpg"

];


let v=0;



function cambiarVertical(valor){

v+=valor;


if(v<0)
v=verticales.length-1;


if(v>=verticales.length)
v=0;


document.getElementById("vertical").src=verticales[v];

}




setInterval(()=>{

cambiarVertical(1);

},10000);



</script>



</body>
</html>
