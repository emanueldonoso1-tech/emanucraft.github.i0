<!DOCTYPE html>
<html>
<head>

<title>Las ideas de Emanu</title>

<style>
body {
    background-color: #111;
    color: white;
    text-align: center;
    font-family: 'Segoe UI', Arial, sans-serif;
}

/* TITULO */
.titulo {
    font-size: 60px;
    margin-top: 50px;
}

/* CONTENEDOR */
.contenedor {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

/* TEXTO NEGRO */
.texto-negro {
    color: black;
    background: white;
    display: inline-block;
    padding: 5px 10px;
    border-radius: 5px;
}

/* IMAGEN PEQUEÑA */
img {
    width: 150px;
}

/* CARRUSEL */
.carrusel {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 40px;
    gap: 20px;
}

.carrusel img {
    width: 600px;
    border-radius: 10px;
    transition: transform 0.3s;
}

.carrusel img:hover {
    transform: scale(1.1);
}

/* FLECHAS AZULES */
button {
    background: blue;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 20px;
    border-radius: 10px;
    cursor: pointer;
}

/* POSTERS VERTICALES */
.posters {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 50px;
}

.posters img {
    width: 200px;
    height: 300px;
    object-fit: cover;
    border-radius: 10px;
    transition: transform 0.3s;
}

.posters img:hover {
    transform: scale(1.1);
}

/* CHAT */
.chat {
    margin-top: 50px;
}

#mensajes {
    background: #222;
    color: white;
    padding: 10px;
    height: 150px;
    overflow-y: scroll;
    margin-bottom: 10px;
}
</style>

</head>

<body>

<div class="contenedor">
    <h1 class="titulo">Las ideas de Emanu</h1>
    <img src="dibujo.png">
</div>

<p class="texto-negro">Bienvenido a mis historias</p>

<!-- 🎬 CARRUSEL -->
<div class="carrusel">
    <button onclick="anterior()">⬅️</button>
    <img id="poster" src="dibujo.png">
    <button onclick="siguiente()">➡️</button>
</div>

<!-- 🎥 POSTERS VERTICALES -->
<div class="posters">
    <img src="dibujo.png">
    <img src="dibujo.png">
    <img src="dibujo.png">
</div>

<p class="texto-negro">Chatea tus ideas</p>

<!-- 💬 CHAT -->
<div class="chat">
    <div id="mensajes"></div>
    <input type="text" id="inputMensaje" placeholder="Escribe algo...">
    <button onclick="enviarMensaje()">Enviar</button>
</div>

<script>
let imagenes = ["dibujo.png", "dibujo.png"];
let index = 0;

function siguiente() {
    index++;
    if (index >= imagenes.length) index = 0;
    document.getElementById("poster").src = imagenes[index];
}

function anterior() {
    index--;
    if (index < 0) index = imagenes.length - 1;
    document.getElementById("poster").src = imagenes[index];
}

function enviarMensaje() {
    var input = document.getElementById("inputMensaje");
    var mensaje = input.value;

    if (mensaje !== "") {
        var caja = document.getElementById("mensajes");
        var nuevo = document.createElement("p");
        nuevo.textContent = "Tú: " + mensaje;
        caja.appendChild(nuevo);
        input.value = "";
    }
}
</script>

</body>
</html>
