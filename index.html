<!DOCTYPE html>
<html>
<head>

<title>Las ideas de Emanu</title>

<style>
body {
    background-color: #111;
    color: white;
    text-align: center;
    font-family: Arial;
}

.titulo {
    font-size: 60px;
    margin-top: 100px;
}

.contenedor {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

img {
    width: 150px;
}

/* CARRUSEL */
.carrusel {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 50px;
    gap: 20px;
}

.carrusel img {
    width: 600px;
    border-radius: 10px;
}
</style>

</head>

<body>

<div class="contenedor">
    <h1 class="titulo">Las ideas de Emanu</h1>
    <img src="dibujo.png">
</div>

<p>Bienvenido a mis historias</p>

<!-- 🎬 CARRUSEL -->
<div class="carrusel">
    <button onclick="anterior()">⬅️</button>

    <img id="poster" src="poster1.jpg">

    <button onclick="siguiente()">➡️</button>
</div>

<!-- 🧠 JAVASCRIPT -->
<script>
let imagenes = ["poster1.jpg", "poster2.jpg", "poster3.jpg"];
let index = 0;

function siguiente() {
    index++;
    if (index >= imagenes.length) {
        index = 0;
    }
    document.getElementById("poster").src = imagenes[index];
}

function anterior() {
    index--;
    if (index < 0) {
        index = imagenes.length - 1;
    }
    document.getElementById("poster").src = imagenes[index];
}
</script>

</body>
</html>
