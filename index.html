<!DOCTYPE html>
<html>
<head>

<title>Las ideas de Emanu</title>

<style>
body {
    background: white;
    color: black;
    text-align: center;
    font-family: 'Segoe UI', Arial, sans-serif;
}

/* TITULO */
.titulo {
    font-size: 65px;
    margin-top: 40px;
    font-weight: bold;
}

/* CONTENEDOR */
.contenedor {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

/* TEXTO */
.texto-negro {
    background: white;
    color: black;
    border: 2px solid black;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 22px;
    margin-top: 20px;
}

/* IMAGEN */
img {
    width: 150px;
}

/* 🎬 CARRUSEL */
.carrusel {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 40px;
    gap: 20px;
}

.carrusel img {
    width: 650px;
    border-radius: 12px;
    transition: 0.3s;
}

.carrusel img:hover {
    transform: scale(1.05);
}

/* 🔵 FLECHAS */
button {
    background: white;
    color: #007bff;
    border: 2px solid #007bff;
    padding: 12px 18px;
    font-size: 22px;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #007bff;
    color: white;
}

/* 🎥 POSTERS */
.posters {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 60px;
}

.posters img {
    width: 180px;
    height: 280px;
    object-fit: cover;
    border-radius: 12px;
    transition: 0.3s;
}

.posters img:hover {
    transform: scale(1.1);
}

/* 💬 TITULO CHAT */
.chat-titulo {
    font-size: 30px;
    margin-top: 60px;
    background: white;
    color: black;
    padding: 15px 30px;
    border-radius: 15px;
    border: 2px solid black;
}

/* 💬 CHAT */
.chat {
    margin-top: 20px;
}

#mensajes {
    background: #f0f0f0;
    color: black;
    padding: 15px;
    height: 200px;
    width: 300px;
    margin: auto;
    border-radius: 10px;
    overflow-y: scroll;
    margin-bottom: 10px;
}
</style>

</head>

<body>

<div class="contenedor">
    <h1 class="titulo">Las ideas de Emanu</h1>
    <img src="dibujo.png">
</div>

<p class="texto-negro">Bienvenido a mis historias</p>

<!-- 🎬 CARRUSEL -->
<div class="carrusel">
    <button onclick="anterior()">❮</button>
    <img id="poster" src="dibujo.png">
    <button onclick="siguiente()">❯</button>
</div>

<!-- 🎥 POSTERS -->
<div class="posters">
    <img src="dibujo.png">
    <img src="dibujo.png">
    <img src="dibujo.png">
</div>

<!-- 💬 CHAT -->
<div class="chat-titulo">CHATEA TUS IDEAS</div>

<div class="chat">
    <div id="mensajes"></div>
    <input type="text" id="inputMensaje" placeholder="Escribe algo...">
    <button onclick="enviarMensaje()">Enviar</button>
</div>

<script>
let imagenes = ["dibujo.png", "dibujo.png"];
let index = 0;

function siguiente() {
    index++;
    if (index >= imagenes.length) index = 0;
    document.getElementById("poster").src = imagenes[index];
}

function anterior() {
    index--;
    if (index < 0) index = imagenes.length - 1;
    document.getElementById("poster").src = imagenes[index];
}

function enviarMensaje() {
    var input = document.getElementById("inputMensaje");
    var mensaje = input.value;

    if (mensaje !== "") {
        var caja = document.getElementById("mensajes");
        var nuevo = document.createElement("p");
        nuevo.textContent = "Tú: " + mensaje;
        caja.appendChild(nuevo);
        input.value = "";
    }
}
</script>

</body>
</html>
